validate-js:
  filter: rjsmin
  output: ckanext-validate/%(version)s-validate.js
  contents:
    - js/validate.js
  extra:
    preload:
      - base/main

validate-css:
  filter: cssrewrite
  output: ckanext-validate/%(version)s-validate.css
  contents:
    - css/validate.css

validation-configuration-js:
  filter: rjsmin
  output: ckanext-validate/%(version)s-validation-configuration.js
  contents:
    - js/validation-configuration.js
  extra:
    preload:
      - base/main

validation-configuration-css:
  filter: cssrewrite
  output: ckanext-validate/%(version)s-validation-configuration.css
  contents:
    - css/validation-configuration.css
